  <script type="text/babel">

    const STARS = [

      "അവിട്ടം", "ചതയം", "പൂരുരുട്ടാതി", "ഉത്രട്ടാതി", "രേവതി"

    const MONTH_OPTIONS = [
      "2026 ജനുവരി", "2026 ഫെബ്രുവരി", "2026 മാർച്ച്", "2026 ഏപ്രിൽ", "2026 മേയ്", "2026 ജൂൺ",

      "2027 ജൂലൈ", "2027 ഓഗസ്റ്റ്", "2027 സെപ്റ്റംബർ", "2027 ഒക്ടോബർ", "2027 നവംബർ", "2027 ഡിസംബർ"

    const INITIAL_OFFERINGS = [
      { id: 'off_1', name_ml: 'പുഷ്പാഞ്ജലി', rate: 20, deity: 'ശ്രീ കോവിൽ (മഹാദേവൻ)', category: 'വഴിപാട്' },

      { id: 'off_3', name_ml: 'പായസം (1 ലിറ്റർ)', rate: 150, deity: 'ദേവി', category: 'വഴിപാട്' },
      { id: 'off_4', name_ml: 'അന്നദാനം (1 ആൾ)', rate: 100, deity: 'ക്ഷേത്രം', category: 'അന്നദാനം' },
      { id: 'off_5', name_ml: 'സംഭാവന / കാണിക്ക', rate: 500, deity: 'ക്ഷേത്രം', category: 'സംഭാവന' },
      { id: 'off_6', name_ml: 'മാലവഴിപാട്', rate: 250, deity: 'ശ്രീ കോവിൽ (വിഷ്ണു)', category: 'വഴിപാട്' },
      { id: 'off_7', name_ml: 'മുപ്പെട്ട് വ്യാഴാഴ്ച പ്രത്യേക നിവേദ്യം', rate: 200, deity: 'വിഷ്ണു', category: 'വഴിപാട്' }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('vazhipadu');
      const [user, setUser] = useState(null);
      const [fb, setFb] = useState(null);

      // Login / Role System State & Password State
      const [currentUserRole, setCurrentUserRole] = useState('counter1');
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [loginPasscode, setLoginPasscode] = useState('');
      const [adminPasscode, setAdminPasscode] = useState(() => {
        return localStorage.getItem('temple_admin_passcode') || '1234';
      });

      useEffect(() => {
        localStorage.setItem('temple_admin_passcode', adminPasscode);
      }, [adminPasscode]);
      const [showChangePassModal, setShowChangePassModal] = useState(false);
      const [oldPassInput, setOldPassInput] = useState('');
      const [newPassInput, setNewPassInput] = useState('');
      const [confirmPassInput, setConfirmPassInput] = useState('');

      const [deities, setDeities] = useState(INITIAL_DEITIES);
      const [offerings, setOfferings] = useState(INITIAL_OFFERINGS);
      const [receipts, setReceipts] = useState([]);
      const [transactions, setTransactions] = useState([]);
      const [monthlyMembers, setMonthlyMembers] = useState([]);
      const [muppettuMembers, setMuppettuMembers] = useState([]);
      const [staffList, setStaffList] = useState([]);

      const [showOfferingModal, setShowOfferingModal] = useState(false);
      const [showMemberModal, setShowMemberModal] = useState(false);
      const [showMuppettuModal, setShowMuppettuModal] = useState(false);
      const [showStaffModal, setShowStaffModal] = useState(false);
      const [showPayRecordModal, setShowPayRecordModal] = useState(false);
      const [showMuppettuPayModal, setShowMuppettuPayModal] = useState(false);
      const [showExpenseModal, setShowExpenseModal] = useState(false);
      const [showIncomeModal, setShowIncomeModal] = useState(false);

      // Income & Expense Forms
      const [incCategory, setIncCategory] = useState('അന്നദാനം');
      const [incPayerName, setIncPayerName] = useState('');
      const [incAmount, setIncAmount] = useState('');
      const [incNotes, setIncNotes] = useState('');
      const [incPayMode, setIncPayMode] = useState('Cash');

      const [expCategory, setExpCategory] = useState('അന്നദാനത്തിനുള്ള സാധനങ്ങൾ');
      const [expAmount, setExpAmount] = useState('');
      const [expNotes, setExpNotes] = useState('');
      const [expDate, setExpDate] = useState(new Date().toISOString().split('T')[0]);

      // Monthly Member State & Dropdown Filter
      const [memberSearchQuery, setMemberSearchQuery] = useState('');
      const [selectedStarFilter, setSelectedStarFilter] = useState('');
      const [selectedOfferingFilter, setSelectedOfferingFilter] = useState('');
      const [onlyMalaVazhipadu, setOnlyMalaVazhipadu] = useState(false);
      const [showStarSummary, setShowStarSummary] = useState(true);
      const [selectedMemberForPay, setSelectedMemberForPay] = useState(null);
      const [recordMonthVal, setRecordMonthVal] = useState(MONTH_OPTIONS[10]);
      const [recordPayModeVal, setRecordPayModeVal] = useState('Cash');

      // Muppettu Member State & Dropdown Filter
      const [muppettuSearchQuery, setMuppettuSearchQuery] = useState('');
      const [selectedMuppettuOfferingFilter, setSelectedMuppettuOfferingFilter] = useState('');
      const [onlyGanapathiHoma, setOnlyGanapathiHoma] = useState(false);
      const [selectedMuppettuForPay, setSelectedMuppettuForPay] = useState(null);

      // Offering Summary Dropdown Filter State
      const [summarySearchQuery, setSummarySearchQuery] = useState('');

      // Offering Form
      const [editingOfferingId, setEditingOfferingId] = useState(null);
      const [offName, setOffName] = useState('');
      const [offRate, setOffRate] = useState('');
      const [offCategory, setOffCategory] = useState('വഴിപാട്');
      const [offDeity, setOffDeity] = useState(INITIAL_DEITIES[0]);
      const [newDeityName, setNewDeityName] = useState('');

      // Monthly Member Form
      const [editingMemberId, setEditingMemberId] = useState(null);
      const [memName, setMemName] = useState('');
      const [memStar, setMemStar] = useState(STARS[0]);
      const [memPhone, setMemPhone] = useState('');
      const [memSelectedOfferingIds, setMemSelectedOfferingIds] = useState(['off_6']);
      const [memOccurrence, setMemOccurrence] = useState('ഒന്നാമത്തെ പൂജ');
      const [memAmount, setMemAmount] = useState('250');
      const [memPaidUntil, setMemPaidUntil] = useState(MONTH_OPTIONS[10]);
      const [memDueUntil, setMemDueUntil] = useState(MONTH_OPTIONS[11]);
      const [memPayMode, setMemPayMode] = useState('Cash');

      // Muppettu Member Form
      const [editingMuppettuId, setEditingMuppettuId] = useState(null);
      const [mupName, setMupName] = useState('');
      const [mupStar, setMupStar] = useState(STARS[0]);
      const [mupPhone, setMupPhone] = useState('');
      const [mupSelectedOfferingIds, setMupSelectedOfferingIds] = useState(['off_7']);
      const [mupOccurrence, setMupOccurrence] = useState('ഒന്നാമത്തെ പൂജ');
      const [mupAmount, setMupAmount] = useState('200');
      const [mupPaidUntil, setMupPaidUntil] = useState(MONTH_OPTIONS[10]);
      const [mupDueUntil, setMupDueUntil] = useState(MONTH_OPTIONS[11]);
      const [mupPayMode, setMupPayMode] = useState('Cash');
      const [mupNotes, setMupNotes] = useState('');

      // Staff Form
      const [staffName, setStaffName] = useState('');
      const [staffDesig, setStaffDesig] = useState('മേൽശാന്തി');
      const [staffPhone, setStaffPhone] = useState('');
      const [staffSalary, setStaffSalary] = useState('');

      // Cart States
      const [devoteeName, setDevoteeName] = useState('');
      const [star, setStar] = useState(STARS[0]);
      const [place, setPlace] = useState('');
      const [phone, setPhone] = useState('');
      const [paymentMode, setPaymentMode] = useState('Cash');
      const [cartItems, setCartItems] = useState([]);
      const [selectedOfferingId, setSelectedOfferingId] = useState('');
      const [itemQty, setItemQty] = useState(1);
      const [customAmount, setCustomAmount] = useState('');
      const [selectedPrintReceipt, setSelectedPrintReceipt] = useState(null);

      const [filterDate, setFilterDate] = useState(new Date().toISOString().split('T')[0]);
      const [filterMonth, setFilterMonth] = useState('2026-11');

      useEffect(() => {
        const timer = setInterval(() => {
          if (window.firebaseModules) {
            clearInterval(timer);
            const { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, getDatabase } = window.firebaseModules;
            try {
              const app = initializeApp(firebaseConfig);
              const auth = getAuth(app);
              const rtdb = getDatabase(app);
              setFb({ app, auth, rtdb });

              signInAnonymously(auth).catch(e => console.warn("Auth fallback", e));
              onAuthStateChanged(auth, setUser);
            } catch (e) {
              console.warn("Firebase Init Error", e);
            }
          }
        }, 100);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        if (!fb) return;
        const { ref, onValue } = window.firebaseModules;

        const syncPath = (pathName, setter, fallback = []) => {
          const dbRef = ref(fb.rtdb, `temple_data/${pathName}`);
          return onValue(dbRef, (snapshot) => {
            const val = snapshot.val();
            if (val) {
              const list = Object.keys(val).map(key => ({ id: key, ...val[key] }));
              setter(list.reverse());
            } else {
              setter(fallback);
            }
          });
        };

        const u1 = syncPath('offerings', setOfferings, INITIAL_OFFERINGS);
        const u2 = syncPath('receipts', setReceipts);
        const u3 = syncPath('transactions', setTransactions);
        const u4 = syncPath('monthlyMembers', setMonthlyMembers);
        const u5 = syncPath('staffList', setStaffList);
        const u6 = syncPath('muppettuMembers', setMuppettuMembers);
        const u7 = syncPath('deities', (data) => {
          if(data && data.length > 0) setDeities(data.map(d => d.name));
        });

        const passRef = ref(fb.rtdb, 'temple_data/settings/adminPasscode');
        const u8 = onValue(passRef, (snapshot) => {
          const val = snapshot.val();
          if (val) {
            setAdminPasscode(val);
            localStorage.setItem('temple_admin_passcode', val);
          }
        });

        return () => { u1(); u2(); u3(); u4(); u5(); u6(); u7(); u8(); };
      }, [fb]);

      const addData = async (pathName, data) => {
        if (fb) {
          const { ref, push, set } = window.firebaseModules;
          const dbRef = ref(fb.rtdb, `temple_data/${pathName}`);
          const newRef = push(dbRef);
          await set(newRef, { ...data, createdAt: new Date().toISOString() });
          return newRef.key;
        }
      };

      const updateData = async (pathName, id, data) => {
        if (fb) {
          const { ref, update } = window.firebaseModules;
          const dbRef = ref(fb.rtdb, `temple_data/${pathName}/${id}`);
          await update(dbRef, data);
        }
      };

      const deleteData = async (pathName, id) => {
        if (currentUserRole !== 'admin') {
          alert('ഈ ഡിലീറ്റ് ചെയ്യാനുള്ള അധികാരം അഡ്മിന് (Admin) മാത്രമുള്ളതാണ്!');
          return;
        }
        if (fb) {
          const { ref, remove } = window.firebaseModules;
          const dbRef = ref(fb.rtdb, `temple_data/${pathName}/${id}`);
          await remove(dbRef);
        }
      };

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        if (currentUserRole === 'admin') {
          if (loginPasscode === adminPasscode) {
            alert('അഡ്മിൻ (Admin) ആയി ലോഗിൻ ചെയ്തു!');
            setShowLoginModal(false);
            setLoginPasscode('');
          } else {
            alert('തെറ്റായ പാസ്‌കോഡ്!');
          }
        } else {
          const roleNames = {
            counter1: 'കൗണ്ടർ യൂസർ 1',
            counter2: 'കൗണ്ടർ യൂസർ 2',
            counter3: 'കൗണ്ടർ യൂസർ 3'
          };
          alert(`${roleNames[currentUserRole] || 'യൂസർ'} ആയി പ്രവർത്തിക്കുന്നു!`);
          setShowLoginModal(false);
          setLoginPasscode('');
        }
      };

      const handleAddDeity = async () => {
        if (!newDeityName.trim()) return;
        const updated = [...deities, newDeityName.trim()];
        setDeities(updated);
        await addData('deities', { name: newDeityName.trim() });
        setNewDeityName('');
      };

      const handleSaveOffering = async (e) => {
        e.preventDefault();
        const obj = { name_ml: offName, rate: Number(offRate), category: offCategory, deity: offDeity };
        if (editingOfferingId) {
          await updateData('offerings', editingOfferingId, obj);
        } else {
          await addData('offerings', obj);
        }
        setShowOfferingModal(false);
        setOffName(''); setOffRate(''); setEditingOfferingId(null);
      };

      const toggleMonthlyOfferingId = (offId) => {
        let updatedList;
        if (memSelectedOfferingIds.includes(offId)) {
          updatedList = memSelectedOfferingIds.filter(id => id !== offId);
        } else {
          updatedList = [...memSelectedOfferingIds, offId];
        }
        setMemSelectedOfferingIds(updatedList);

        const total = updatedList.reduce((sum, id) => {
          const found = offerings.find(o => o.id === id);
          return sum + (found ? Number(found.rate) : 0);
        }, 0);
        setMemAmount(total.toString());
      };

      const toggleMuppettuOfferingId = (offId) => {
        let updatedList;
        if (mupSelectedOfferingIds.includes(offId)) {
          updatedList = mupSelectedOfferingIds.filter(id => id !== offId);
        } else {
          updatedList = [...mupSelectedOfferingIds, offId];
        }
        setMupSelectedOfferingIds(updatedList);

        const total = updatedList.reduce((sum, id) => {
          const found = offerings.find(o => o.id === id);
          return sum + (found ? Number(found.rate) : 0);
        }, 0);
        setMupAmount(total.toString());
      };

      const handleSaveMember = async (e) => {
        e.preventDefault();
        if (!memName.trim()) {
          alert('ദയവായി ഭക്തന്റെ പേര് രേഖപ്പെടുത്തുക!');
          return;
        }
        if (memSelectedOfferingIds.length === 0) {
          alert('ദയവായി കുറഞ്ഞത് ഒരു വഴിപാടങ്കിലും തിരഞ്ഞെടുക്കുക!');
          return;
        }
        const descriptiveNames = memSelectedOfferingIds.map(id => {
          const found = offerings.find(o => o.id === id);
          return found ? `${found.name_ml} (${found.deity})` : '';
        }).filter(Boolean);

        const poojaNameCombined = descriptiveNames.join(', ');
        
        const obj = { 
          name: memName, 
          star: memStar, 
          phone: memPhone, 
          poojaName: poojaNameCombined || 'വഴിപാട്',
          selectedOfferingIds: memSelectedOfferingIds,
          occurrence: memOccurrence,
          amount: Number(memAmount), 
          paidUntil: memPaidUntil,
          dueUntil: memDueUntil,
          paymentMode: memPayMode
        };
        if (editingMemberId) {
          await updateData('monthlyMembers', editingMemberId, obj);
        } else {
          await addData('monthlyMembers', obj);
        }
        setShowMemberModal(false);
        setMemName(''); setMemPhone(''); setEditingMemberId(null);
      };

      const handleSaveMuppettuMember = async (e) => {
        e.preventDefault();
        if (!mupName.trim()) {
          alert('ദയവായി ഭക്തന്റെ പേര് രേഖപ്പെടുത്തുക!');
          return;
        }
        if (mupSelectedOfferingIds.length === 0) {
          alert('ദയവായി കുറഞ്ഞത് ഒരു വഴിപാടങ്കിലും തിരഞ്ഞെടുക്കുക!');
          return;
        }
        const descriptiveNames = mupSelectedOfferingIds.map(id => {
          const found = offerings.find(o => o.id === id);
          return found ? `${found.name_ml} (${found.deity})` : '';
        }).filter(Boolean);

        const poojaNameCombined = descriptiveNames.join(', ');

        const obj = { 
          name: mupName, 
          star: mupStar, 
          phone: mupPhone, 
          poojaName: poojaNameCombined || 'മുപ്പെട്ട് വ്യാഴാഴ്ച പൂജ', 
          selectedOfferingIds: mupSelectedOfferingIds,
          occurrence: mupOccurrence,
          amount: Number(mupAmount), 
          paidUntil: mupPaidUntil,
          dueUntil: mupDueUntil,
          paymentMode: mupPayMode,
          notes: mupNotes
        };
        if (editingMuppettuId) {
          await updateData('muppettuMembers', editingMuppettuId, obj);
        } else {
          await addData('muppettuMembers', obj);
        }
        setShowMuppettuModal(false);
        setMupName(''); setMupPhone(''); setMupNotes(''); setEditingMuppettuId(null);
      };

      const handleConfirmPaymentRecord = async (e) => {
        e.preventDefault();
        if (!selectedMemberForPay) return;

                  <label className="block font-bold mb-1 text-amber-900">പൂജ ക്രമം / വിവരം (Description Box):</label>
                  <select value={mupOccurrence} onChange={e => setMupOccurrence(e.target.value)} className="w-full p-2 border rounded bg-white font-bold text-amber-950">
                    <option value="ഒന്നാമത്തെ പൂജ">ഒന്നാമത്തെ പൂജ (മാസത്തിലെ ആദ്യ വ്യാഴാഴ്ച)</option>
                    <option value="രണ്ടാമത്തെ പൂജ">രണ്ടാമത്തെ പൂജ</option>
                    <option value="പ്രത്യേക വഴിപാട്">പ്രത്യേക വഴിപാട്</option>
                  </select>
                </div>

                <div>
                  <label className="block font-bold mb-1">ആകെ തുക (₹ - ഓട്ടോമാറ്റിക്):</label>
                  <input type="number" placeholder="തുക" value={mupAmount} onChange={e => setMupAmount(e.target.value)} required className="w-full p-2 border rounded font-bold text-emerald-800 bg-amber-50/50" />
                </div>
                
                <div>
                  <label className="block font-bold mb-1">ഏത് മാസം വരെ അടച്ചു:</label>
                  <select value={mupPaidUntil} onChange={e => setMupPaidUntil(e.target.value)} className="w-full p-2 border rounded bg-white font-bold text-emerald-900">
                    {MONTH_OPTIONS.map((m, idx) => <option key={idx} value={m}>{m}</option>)}
                  </select>
                </div>

                <div>
                  <label className="block font-bold mb-1">ഏത് മാസം വരെ ബാക്കിയുണ്ട്:</label>
                  <select value={mupDueUntil} onChange={e => setMupDueUntil(e.target.value)} className="w-full p-2 border rounded bg-white font-bold text-rose-900">
                    {MONTH_OPTIONS.map((m, idx) => <option key={idx} value={m}>{m}</option>)}
                  </select>
                </div>

                <div>
                  <label className="block font-bold mb-1">പെയ്‌മെന്റ് രീതി (Payment Mode)</label>
                  <select value={mupPayMode} onChange={e => setMupPayMode(e.target.value)} className="w-full p-2 border rounded bg-white">
                    <option value="Cash">Cash (പണം)</option>
                    <option value="QR Code">QR Code</option>
                    <option value="Cheque">Cheque</option>
                    <option value="Online">Online Transfer</option>
                  </select>
                </div>

                <div>
                  <label className="block font-bold mb-1">അധിക വിവരങ്ങൾ / കുറിപ്പുകൾ:</label>
                  <input type="text" placeholder="കുറിപ്പുകൾ" value={mupNotes} onChange={e => setMupNotes(e.target.value)} className="w-full p-2 border rounded" />
                </div>

                <div className="flex justify-end gap-2 pt-2 border-t">
                  <button type="button" onClick={() => setShowMuppettuModal(false)} className="px-3 py-1 bg-gray-200 rounded font-bold">റദ്ദാക്കുക</button>
                  <button type="submit" className="px-3 py-1 bg-amber-800 text-white rounded font-bold">സേവ് ചെയ്യുക</button>
                </div>
              </form>
            </div>
          )}

          {/* Monthly Payment Record Modal */}
          {showPayRecordModal && selectedMemberForPay && (
            <div className="fixed inset-0 bg-black/50 flex justify-center items-center p-4 z-50">
              <form onSubmit={handleConfirmPaymentRecord} className="bg-white p-5 rounded-xl max-w-sm w-full space-y-3 text-xs shadow-2xl">
                <h3 className="font-bold text-sm border-b pb-1">പണം സ്വീകരിച്ച വിവരം രേഖപ്പെടുത്തുക (മാസപൂജ)</h3>
                <div className="bg-amber-50 p-2 rounded border border-amber-200 font-bold">
                  <div>ഭക്തൻ: {selectedMemberForPay.name} ({selectedMemberForPay.star})</div>
                  <div>പൂജകൾ: {selectedMemberForPay.poojaName}</div>
                  <div>ക്രമം: {selectedMemberForPay.occurrence || 'ഒന്നാമത്തെ പൂജ'}</div>
                  <div>തുക: ₹{selectedMemberForPay.amount}</div>
                </div>

                <div>
                  <label className="block font-bold mb-1">ഏത് മാസം വരെ അടച്ചു:</label>
                  <select value={recordMonthVal} onChange={e => setRecordMonthVal(e.target.value)} className="w-full p-2 border rounded bg-white font-bold text-emerald-900">
                    {MONTH_OPTIONS.map((m, idx) => <option key={idx} value={m}>{m}</option>)}
                  </select>
                </div>

                <div>
                  <label className="block font-bold mb-1">പെയ്‌മെന്റ് രീതി:</label>
                  <select value={recordPayModeVal} onChange={e => setRecordPayModeVal(e.target.value)} className="w-full p-2 border rounded bg-white">
                    <option value="Cash">Cash (പണം)</option>
                    <option value="QR Code">QR Code</option>
                    <option value="Cheque">Cheque</option>
                    <option value="Online">Online Transfer</option>
                  </select>
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setShowPayRecordModal(false)} className="px-3 py-1 bg-gray-200 rounded font-bold">റദ്ദാക്കുക</button>
                  <button type="submit" className="px-3 py-1 bg-emerald-700 text-white font-bold rounded">സേവ് & പ്രിന്റ്</button>
                </div>
              </form>
            </div>
          )}

          {/* Muppettu Payment Record Modal */}
          {showMuppettuPayModal && selectedMuppettuForPay && (
            <div className="fixed inset-0 bg-black/50 flex justify-center items-center p-4 z-50">
              <form onSubmit={handleConfirmMuppettuPayRecord} className="bg-white p-5 rounded-xl max-w-sm w-full space-y-3 text-xs shadow-2xl">
                <h3 className="font-bold text-sm border-b pb-1">മുപ്പെട്ട് വ്യാഴാഴ്ച പൂജ - പണം സ്വീകരിച്ച വിവരം</h3>
                <div className="bg-amber-50 p-2 rounded border border-amber-200 font-bold">
                  <div>ഭക്തൻ: {selectedMuppettuForPay.name} ({selectedMuppettuForPay.star})</div>
                  <div>പൂജകൾ: {selectedMuppettuForPay.poojaName}</div>
                  <div>ക്രമം: {selectedMuppettuForPay.occurrence || 'ഒന്നാമത്തെ പൂജ'}</div>
                  <div>തുക: ₹{selectedMuppettuForPay.amount}</div>
                </div>

                <div>
                  <label className="block font-bold mb-1">ഏത് മാസം വരെ അടച്ചു:</label>
                  <select value={recordMonthVal} onChange={e => setRecordMonthVal(e.target.value)} className="w-full p-2 border rounded bg-white font-bold text-emerald-900">
                    {MONTH_OPTIONS.map((m, idx) => <option key={idx} value={m}>{m}</option>)}
                  </select>
                </div>

                <div>
                  <label className="block font-bold mb-1">പെയ്‌മെന്റ് രീതി:</label>
                  <select value={recordPayModeVal} onChange={e => setRecordPayModeVal(e.target.value)} className="w-full p-2 border rounded bg-white">
                    <option value="Cash">Cash (പണം)</option>
                    <option value="QR Code">QR Code</option>
                    <option value="Cheque">Cheque</option>
                    <option value="Online">Online Transfer</option>
                  </select>
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setShowMuppettuPayModal(false)} className="px-3 py-1 bg-gray-200 rounded font-bold">റദ്ദാക്കുക</button>
                  <button type="submit" className="px-3 py-1 bg-emerald-700 text-white font-bold rounded">സേവ് & പ്രിന്റ്</button>
                </div>
              </form>
            </div>
          )}

          {/* Staff Modal */}
          {showStaffModal && (
            <div className="fixed inset-0 bg-black/50 flex justify-center items-center p-4 z-50">
              <form onSubmit={handleSaveStaff} className="bg-white p-5 rounded-xl max-w-sm w-full space-y-3 text-xs shadow-2xl">
                <h3 className="font-bold text-sm border-b pb-1">ജീവനക്കാരന്റെ വിവരങ്ങൾ</h3>
                <input type="text" placeholder="പേര്" value={staffName} onChange={e => setStaffName(e.target.value)} required className="w-full p-2 border rounded" />
                <input type="text" placeholder="തസ്തിക (Designation)" value={staffDesig} onChange={e => setStaffDesig(e.target.value)} required className="w-full p-2 border rounded" />
                <input type="number" placeholder="അടിസ്ഥാന ശമ്പളം" value={staffSalary} onChange={e => setStaffSalary(e.target.value)} required className="w-full p-2 border rounded" />
                <input type="text" placeholder="ഫോൺ" value={staffPhone} onChange={e => setStaffPhone(e.target.value)} className="w-full p-2 border rounded" />
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setShowStaffModal(false)} className="px-3 py-1 bg-gray-200 rounded font-bold">റദ്ദാക്കുക</button>
                  <button type="submit" className="px-3 py-1 bg-amber-800 text-white rounded font-bold">സേവ് ചെയ്യുക</button>
                </div>
              </form>
            </div>
          )}

          {/* Income Entry Modal */}
          {showIncomeModal && (
            <div className="fixed inset-0 bg-black/50 flex justify-center items-center p-4 z-50">
              <form onSubmit={handleSaveOtherIncome} className="bg-white p-5 rounded-xl max-w-sm w-full space-y-3 text-xs shadow-2xl">
                <h3 className="font-bold text-sm border-b pb-1 text-emerald-900">+ മറ്റ് വരുമാനങ്ങൾ രേഖപ്പെടുത്തുക</h3>
                <div>
                  <label className="block font-bold mb-1">വരുമാന വിഭാഗം:</label>
                  <select value={incCategory} onChange={e => setIncCategory(e.target.value)} className="w-full p-2 border rounded bg-white font-bold">
                    <option value="അന്നദാനം">അന്നദാനം</option>
                    <option value="സംഭാവന">സംഭാവന</option>
                    <option value="ഭണ്ഡാരവരവ്">ഭണ്ഡാരവരവ്</option>
                    <option value="മാസവരി">മാസവരി</option>
                    <option value="നിർമ്മാണ പ്രവർത്തികൾ">നിർമ്മാണ പ്രവർത്തികൾ</option>
                    <option value="അഖണ്ഡനാമം">സംഭാവന അഖണ്ഡനാമം</option>
                    <option value="മറ്റു വരുമാനങ്ങൾ">മറ്റു വരുമാനങ്ങൾ</option>
                  </select>
                </div>

                <div>
                  <label className="block font-bold mb-1">നൽകിയ ആളുടെ പേര്:</label>
                  <input type="text" placeholder="പേര്" value={incPayerName} onChange={e => setIncPayerName(e.target.value)} className="w-full p-2 border rounded" />
                </div>

                <div>
                  <label className="block font-bold mb-1">തുക (₹):</label>
                  <input type="number" placeholder="തുക" value={incAmount} onChange={e => setIncAmount(e.target.value)} required className="w-full p-2 border rounded font-bold text-emerald-800 text-sm" />
                </div>

                <div>
                  <label className="block font-bold mb-1">പെയ്‌മെന്റ് രീതി (Payment Mode):</label>
                  <select value={incPayMode} onChange={e => setIncPayMode(e.target.value)} className="w-full p-2 border rounded bg-white font-bold">
                    <option value="Cash">Cash (പണം)</option>
                    <option value="QR Code">QR Code</option>
                    <option value="Cheque">Cheque</option>
                    <option value="Online">Online Transfer</option>
                  </select>
                </div>

                <div>
                  <label className="block font-bold mb-1">കുറിപ്പ് / വിശദാംശം:</label>
                  <input type="text" placeholder="വിശദാംശങ്ങൾ" value={incNotes} onChange={e => setIncNotes(e.target.value)} className="w-full p-2 border rounded" />
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setShowIncomeModal(false)} className="px-3 py-1 bg-gray-200 rounded font-bold">റദ്ദാക്കുക</button>
                  <button type="submit" className="px-3 py-1 bg-emerald-700 text-white rounded font-bold">സേവ് ചെയ്യുക</button>
                </div>
              </form>
            </div>
          )}

          {/* Expense Entry Modal */}
          {showExpenseModal && (
            <div className="fixed inset-0 bg-black/50 flex justify-center items-center p-4 z-50">
              <form onSubmit={handleSaveExpense} className="bg-white p-5 rounded-xl max-w-sm w-full space-y-3 text-xs shadow-2xl">
                <h3 className="font-bold text-sm border-b pb-1 text-rose-900">- ദിവസേനയുള്ള ചിലവുകൾ രേഖപ്പെടുത്തുക</h3>
                <div>
                  <label className="block font-bold mb-1">ചിലവിന്റെ തീയതി:</label>
                  <input type="date" value={expDate} onChange={e => setExpDate(e.target.value)} required className="w-full p-2 border rounded bg-white font-bold" />
                </div>

                <div>
                  <label className="block font-bold mb-1">ചിലവ് വിഭാഗം (Expense Category):</label>
                  <select value={expCategory} onChange={e => setExpCategory(e.target.value)} className="w-full p-2 border rounded bg-white font-bold">
                    <option value="അന്നദാനത്തിനുള്ള സാധനങ്ങൾ">അന്നദാനത്തിനുള്ള സാധനങ്ങൾ</option>
                    <option value="നിത്യനിധാനങ്ങൾ">നിത്യനിധാനങ്ങൾ</option>
                    <option value="പൂജാ സാമഗ്രികൾ">പൂജാ സാമഗ്രികൾ (എണ്ണ, പൂവ്, മുതലായവ)</option>
                    <option value="ഇലക്ട്രിസിറ്റി">ഇലക്ട്രിസിറ്റി</option>
                    <option value="ഫോൺ">ഫോൺ</option>
                    <option value="CCTV Recharge">CCTV Recharge</option>
                    <option value="അറ്റകുറ്റപ്പണികൾ & നിർമ്മാണം">അറ്റകുറ്റപ്പണികൾ & നിർമ്മാണം</option>
                    <option value="മറ്റ് ചിലവുകൾ">മറ്റ് ചിലവുകൾ</option>
                  </select>
                </div>

                <div>
                  <label className="block font-bold mb-1">തുക (₹):</label>
                  <input type="number" placeholder="തുക" value={expAmount} onChange={e => setExpAmount(e.target.value)} required className="w-full p-2 border rounded font-bold text-rose-800 text-sm" />
                </div>

                <div>
                  <label className="block font-bold mb-1">സാധനങ്ങളുടെ / ചിലവിന്റെ വിശദാംശങ്ങൾ:</label>
                  <input type="text" placeholder="ഉദാഹരണത്തിന്: അരി, പച്ചക്കറികൾ വാങ്ങി" value={expNotes} onChange={e => setExpNotes(e.target.value)} required className="w-full p-2 border rounded" />
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setShowExpenseModal(false)} className="px-3 py-1 bg-gray-200 rounded font-bold">റദ്ദാക്കുക</button>
                  <button type="submit" className="px-3 py-1 bg-rose-700 text-white rounded font-bold">സേവ് ചെയ്യുക</button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
